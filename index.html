<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>요요 거너</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen phone game — HUD band / canvas stage with side rails / upgrade dock; bottom-sheet modals */
:root{
  --night:#1d2740; --night2:#2b3a5e; --line:#0f1628;
  --panel:#eef3fb; --panel2:#dfe7f5; --ink:#1b2236; --muted:#5d6886;
  --ball:#d4f03c; --ball-ink:#2f3a07; --collar:#ff5d6c; --gem:#5fb6ff; --gold:#ffc83d; --orb:#b77dff;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--line);color:var(--panel);font-family:var(--f-body);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--night);overflow:hidden}
button{font-family:var(--f-display);cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}

/* HUD */
#hud{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--night);border-bottom:3px solid var(--line);z-index:3}
#stagebox{flex:1;min-width:0}
#stageName{font-family:var(--f-display);font-size:18px;line-height:1;display:flex;align-items:center;gap:6px;white-space:nowrap}
#stageName small{font-family:var(--f-body);font-size:12px;color:#aab6d6}
#prog{height:8px;border-radius:5px;background:var(--line);margin-top:6px;overflow:hidden}
#progFill{height:100%;width:0;background:var(--ball);border-radius:5px;transition:width .15s}
.cur{display:flex;align-items:center;gap:3px;background:var(--line);border-radius:999px;padding:2px 9px 2px 3px;font-size:14px}
.cur img{width:20px;height:20px}
#curs{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
#curs .row{display:flex;gap:4px}

/* Stage */
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.rail{position:absolute;top:10px;display:flex;flex-direction:column;gap:7px;z-index:2}
.rail.l{left:max(6px,env(safe-area-inset-left,0px))}.rail.r{right:max(6px,env(safe-area-inset-right,0px))}
.rbtn{width:52px;display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(15,22,40,.72);border:2px solid var(--line);border-radius:14px;padding:4px 0 3px;font-size:12px;color:#fff;position:relative}
.rbtn img{width:30px;height:30px;object-fit:contain}
.rbtn .dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--collar);border:2px solid var(--line)}
#bossBtn{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:2;background:var(--collar);color:#fff;font-size:16px;padding:8px 16px;border-radius:999px;border:3px solid var(--line);box-shadow:0 3px 0 var(--line);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.07)}}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.t{word-break:keep-all;max-width:280px;font-family:var(--f-display);background:rgba(15,22,40,.9);border:2px solid var(--ball);color:#fff;padding:8px 14px;border-radius:12px;font-size:16px;animation:tin 2.2s forwards;text-align:center}
@keyframes tin{0%{opacity:0;transform:translateY(10px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}

/* Upgrade dock */
#dock{background:var(--night);border-top:3px solid var(--line);padding:8px 10px;z-index:3}
#dockTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.seg{display:flex;background:var(--line);border-radius:999px;padding:2px}
.seg button{font-size:13px;padding:3px 10px;border-radius:999px;color:#aab6d6}
.seg button.on{background:var(--ball);color:var(--ball-ink)}
#dps{font-size:12px;color:#aab6d6}
#upgs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.up{background:var(--panel);color:var(--ink);border-radius:14px;border:3px solid var(--line);padding:6px 6px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 var(--line)}
.up:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.up .h{display:flex;align-items:center;gap:4px;font-family:var(--f-display);font-size:14px}
.up .h img{width:22px;height:22px}
.up .lv{font-size:11px;color:var(--muted)}
.up .v{font-family:var(--f-display);font-size:17px;line-height:1.1}
.up .c{display:flex;align-items:center;gap:3px;background:var(--ball);color:var(--ball-ink);border-radius:999px;padding:1px 8px;font-family:var(--f-display);font-size:13px;width:100%;justify-content:center}
.up .c img{width:15px;height:15px}
.up.no .c{background:var(--panel2);color:var(--muted)}

/* Modal sheet */
#modal{position:absolute;inset:0;z-index:10;background:rgba(8,12,24,.55);display:flex;align-items:flex-end}
#sheet{width:100%;max-height:86%;background:var(--panel);color:var(--ink);border-radius:22px 22px 0 0;border-top:4px solid var(--line);display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
#sheetHead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
#sheetTitle{font-family:var(--f-display);font-size:22px}
#sheetClose{width:36px;height:36px;border-radius:50%;background:var(--collar);color:#fff;font-size:20px;border:3px solid var(--line)}
#sheetBody{overflow-y:auto;padding:0 14px calc(16px + env(safe-area-inset-bottom,0px));min-height:0}
.sub{font-size:13px;color:var(--muted);margin:2px 0 10px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.slot{min-width:0;border:3px dashed #b9c5dc;border-radius:14px;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);position:relative}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;max-width:100%;border-radius:12px;border:3px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0}
.cell img{width:82%;height:82%;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.cell .gl{position:absolute;left:3px;top:1px;font-family:var(--f-display);font-size:13px;color:#fff;text-shadow:0 1px 0 #000,0 0 3px #000}
.cell .eq{position:absolute;right:2px;bottom:1px;background:var(--ball);color:var(--ball-ink);font-size:10px;border-radius:6px;padding:0 4px;font-family:var(--f-display)}
.cell.sel{outline:4px solid var(--ball);outline-offset:-1px;transform:scale(1.04)}
.cell.mt{animation:wig .5s infinite}
@keyframes wig{50%{transform:rotate(4deg)}}
.cell.empty{background:var(--panel2);border-style:dashed;border-color:#c3cde0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{flex:1;min-width:0;background:var(--ball);color:var(--ball-ink);border:3px solid var(--line);border-radius:14px;padding:9px 6px;font-size:15px;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.btn img{width:18px;height:18px}
.btn.alt{background:#fff;color:var(--ink)}
.btn.red{background:var(--collar);color:#fff}
.btn.blue{background:var(--gem);color:#0b2440}
.btn.pur{background:var(--orb);color:#fff}
.btn:disabled{opacity:.45;box-shadow:none}
.detail{background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;margin:8px 0}
.detail img{width:64px;height:64px;object-fit:contain}
.detail .dn{font-family:var(--f-display);font-size:17px}
.detail .ds{font-size:13px;color:var(--muted);line-height:1.45}
.pill{display:inline-block;font-family:var(--f-display);font-size:12px;color:#fff;border-radius:6px;padding:0 6px;margin-right:4px}
.reveal{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0 2px}
.reveal .cell{width:52px;animation:pop .35s backwards}
@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}}
.list{display:flex;flex-direction:column;gap:8px}
.li{background:#fff;border:3px solid var(--line);border-radius:14px;padding:9px 10px;display:flex;align-items:center;gap:10px}
.li img{width:40px;height:40px;object-fit:contain}
.li .m{flex:1;min-width:0}
.li .m b{font-family:var(--f-display);font-weight:400;font-size:16px;display:block}
.li .m span{font-size:12px;color:var(--muted)}
.li .btn{flex:0 0 auto;padding:6px 10px;font-size:14px}
.pb{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:4px}
.pb i{display:block;height:100%;background:var(--ball)}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skin{background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.skin img{width:72px;height:72px;object-fit:contain}
.skin b{font-family:var(--f-display);font-weight:400;font-size:14px}
.skin span{font-size:11px;color:var(--muted)}
.skin .btn{width:100%;padding:5px 2px;font-size:13px}
.skin .btn img{width:16px;height:16px}
.skin.on{border-color:var(--ball);box-shadow:0 0 0 3px var(--ball)}
.big{font-family:var(--f-display);font-size:28px;display:flex;align-items:center;gap:6px;justify-content:center}
.big img{width:34px;height:34px}
textarea{width:100%;height:70px;border-radius:10px;border:2px solid #b9c5dc;font-size:11px;padding:6px;font-family:monospace;color:var(--ink);background:#fff;resize:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:10px}
.stats b{font-family:var(--f-display);font-weight:400;float:right}
.gear{font-size:26px;line-height:30px;height:30px}
.skill{position:absolute;bottom:10px;left:max(8px,env(safe-area-inset-left,0px));z-index:2;width:62px;height:62px;border-radius:50%;background:var(--ball);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:var(--ball-ink);padding:0}
.skill.r{left:auto;right:max(8px,env(safe-area-inset-right,0px));background:#fff}
.skill img{width:40px;height:34px;object-fit:contain;margin-top:-2px}
.skill b{font-family:var(--f-display);font-weight:400;font-size:13px;line-height:1;margin-top:-2px}
.skill .cdm{position:absolute;inset:0;background:rgba(15,22,40,.62);color:#fff;font-style:normal;font-family:var(--f-display);font-size:17px;display:flex;align-items:center;justify-content:center}
.skill .cdm:empty{display:none}
.skill.on{box-shadow:0 0 0 4px var(--gold),0 3px 0 var(--line)}
.dexg{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:12px}
.dexg .cell{border-width:2px}
.dexg .cell.no img{filter:brightness(0) opacity(.25)}
.dexh{font-family:var(--f-display);font-size:16px;margin:4px 0 6px;display:flex;justify-content:space-between}
.dexh span{font-family:var(--f-body);font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div id="app">
  <header id="hud">
    <div id="stagebox">
      <div id="stageName"><span id="stLbl" class="num">1-1</span><small id="stTheme">공원</small></div>
      <div id="prog"><div id="progFill"></div></div>
    </div>
    <div id="curs">
      <div class="row"><div class="cur num" title="골드"><img data-a="i_coin" alt=""><span id="cGold">0</span></div></div>
      <div class="row"><div class="cur num" title="다이아"><img data-a="i_gem" alt=""><span id="cGem">0</span></div><div class="cur num" title="환생 구슬"><img data-a="i_orb" alt=""><span id="cOrb">0</span></div></div>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div class="rail l">
      <button class="rbtn" data-open="guns"><img data-a="w_peach" alt="">삑삑이</button>
      <button class="rbtn" data-open="pets"><img data-a="p_chick" alt="">펫</button>
      <button class="rbtn" data-open="gureumi"><img data-a="gu_cloud" alt="">구름이</button>
      <button class="rbtn" data-open="treats"><img data-a="t_bone" alt="">간식</button>
      <button class="rbtn" data-open="skins"><img data-a="y0" alt="">스킨</button>
    </div>
    <div class="rail r">
      <button class="rbtn" data-open="rebirth"><img data-a="i_orb" alt="">환생</button>
      <button class="rbtn" data-open="raid"><img data-a="b_cloud" alt="">레이드</button>
      <button class="rbtn" data-open="missions" id="misBtn"><img data-a="i_trophy" alt="">미션</button>
      <button class="rbtn" data-open="dex"><img data-a="i_chest" alt="">도감</button>
      <button class="rbtn" data-open="settings"><span class="gear" aria-hidden="true">⚙</span>설정</button>
    </div>
    <button class="skill" id="barkBtn" aria-label="멍! 필살기"><img data-a="yx_bark" alt=""><b>멍!</b><i class="cdm"></i></button>
    <button class="skill r" id="buffBtn" aria-label="응원 버프"><img data-a="gu_happy" alt=""><b>응원</b><i class="cdm"></i></button>
    <button id="bossBtn" hidden>보스 재도전!</button>
    <div id="toast"></div>
  </main>
  <footer id="dock">
    <div id="dockTop">
      <div class="seg" id="mulSeg"><button data-m="1" class="on">x1</button><button data-m="10">x10</button><button data-m="0">MAX</button></div>
      <span id="dps" class="num"></span>
      <div class="seg"><button id="autoBtn">자동강화 OFF</button></div>
    </div>
    <div id="upgs">
      <button class="up" data-u="atk"><div class="h"><img data-a="i_atk" alt="">공격력</div><div class="lv">Lv.<span>0</span></div><div class="v num">0</div><div class="c"><img data-a="i_coin" alt=""><span>0</span></div></button>
      <button class="up" data-u="spd"><div class="h"><img data-a="i_spd" alt="">공격속도</div><div class="lv">Lv.<span>0</span></div><div class="v num">0</div><div class="c"><img data-a="i_coin" alt=""><span>0</span></div></button>
      <button class="up" data-u="gold"><div class="h"><img data-a="i_gold" alt="">골드 획득</div><div class="lv">Lv.<span>0</span></div><div class="v num">0</div><div class="c"><img data-a="i_coin" alt=""><span>0</span></div></button>
    </div>
  </footer>
  <div id="modal" hidden>
    <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div id="sheetHead"><div id="sheetTitle"></div><button id="sheetClose" aria-label="닫기">✕</button></div>
      <div id="sheetBody"></div>
    </div>
  </div>

 S.petEq.forEach(id=>{const p=S.pets.find(x=>x.id===id);if(!p)return;const d=PETS[p.t];const v=PET_A[p.g]*(d.x||1);if(d.a==='atk')pA*=1+v/100;else pG*=1+v/100;const b=PET_B[d.b][p.g];if(d.b==='spd')sp+=b;else if(d.b==='crit')cr+=b;else cd+=b});

 const dmg=base*guAtkM(S.gu)*pA*(1+tA/100)*(1+sk/100)*(1+D.atk/100)*(1+.3*R.atk)*Math.pow(1.1,R.atk)*bf;
 const spd=(1+.03*L.spd)*(1+sp/100)*(1+.025*R.spd)*(fv?2:1);
 const gold=(1+.1*L.gold)*Math.pow(1.015,L.gold)*pG*(1+tG/100)*guGoldM(S.gu)*(1+gsb.g/100)*(1+D.gold/100)*(1+.35*R.gold)*Math.pow(1.06,R.gold)*bf*(fv?3:1);
 const ap=(pA*(1+tA/100)*(1+sk/100)*(1+D.atk/100)-1)*100,gp=(pG*(1+tG/100)-1)*100;
 return{dmg,spd,gold,crit:Math.min(cr,100),critd:cd,ap,gp,sp}

function pickType(defs){if(!defs[0].w)return Math.floor(Math.random()*defs.length);const tot=defs.reduce((a,d)=>a+d.w,0);let r=Math.random()*tot;for(let i=0;i<defs.length;i++){if(r<defs[i].w)return i;r-=defs[i].w}return 0}
function draw(kind,n,free){
 const C=COL[kind],L=C.list();
 if(L.length+n>C.cap){toast('보관함이 가득 찼어요. 합성해서 자리를 만드세요');return}
 if(!free){const c=n===10?C.cost*9:C.cost;if(S.gem<c){toast('다이아가 부족해요 · 보스·미션·레이드로 모아요');return}S.gem-=c}
 else S[C.free]=now();
 reveal=[];let newDex=0;
 for(let i=0;i<n;i++){let r=Math.random()*100,g=0;for(;g<DRAW_W.length-1;g++){if(r<DRAW_W[g])break;r-=DRAW_W[g]}
  let ty=pickType(C.defs);if(kind==='treats'&&ty===7&&Math.random()<.8)ty=Math.floor(Math.random()*7);
  const it={id:S.nid++,t:ty,g};L.push(it);reveal.push(it);const dk=C.pre+ty;if(!S.dex[dk]){S.dex[dk]=1;newDex++}}
 if(kind==='guns')S.st.draws+=n;
 if(newDex)toast('도감 등록 '+newDex+'개! 영구 보너스 획득');
 sfx('draw');ST=stats();renderModal()}
function merge(kind,a,b){const C=COL[kind];if(a.g!==b.g||b.g>=8||a===b)return false;
 b.g++;C.set(C.list().filter(x=>x!==a));
 if(C.eq){const E=C.eq();const ia=E.indexOf(a.id);if(ia>=0)E[ia]=E.includes(b.id)?0:b.id}
 S.st.merges++;return true}
function autoMerge(kind){const C=COL[kind];let did=0,go=true;
 while(go){go=false;const E=C.eq?C.eq():[];
  for(let g=0;g<8;g++){const xs=C.list().filter(i=>i.g===g&&!E.includes(i.id));if(xs.length>=2){merge(kind,xs[0],xs[1]);did++;go=true;break}}}
 ST=stats();toast(did?did+'번 합성했어요':'합성할 짝이 없어요');sel=null;renderModal()}
function equip(kind,it){const E=COL[kind].eq();if(E.includes(it.id)){if(kind==='guns'&&E.filter(Boolean).length===1){toast('삑삑이는 최소 1개 장착해야 해요');return}E[E.indexOf(it.id)]=0}
 else{let i=E.indexOf(0);if(i<0){const val=x=>{const o=COL[kind].list().find(y=>y.id===x);return o?o.g:0};i=E.map((x,j)=>[val(x),j]).sort((a,b)=>a[0]-b[0])[0][1]}E[i]=it.id}
 ST=stats();sel=null;renderModal()}
function timeLeft(k,cd){const r=cd-(now()-(S[k]||0));if(r<=0)return 0;const m=Math.floor(r/60e3),s=Math.floor(r/1e3)%60;return m+':'+String(s).padStart(2,'0')}

 if(E){h+=`<div class="slots">`+E.map((id,i)=>{const it=L.find(x=>x.id===id);return it?`<div class="slot" style="border-style:solid;border-color:${GC[it.g]};background:${GC[it.g]}22"><img src="${src(C.defs[it.t].k)}" style="width:44px;height:40px;object-fit:contain" alt=""><span style="color:var(--ink)">${GR[it.g]} ${C.defs[it.t].n}</span></div>`:`<div class="slot">빈 슬롯 ${i+1}</div>`}).join('')+`</div>`}
 else{const o={};L.forEach(it=>{const d=TREATS[it.t];o[d.s]=(o[d.s]||0)+TV[d.s][it.g]*(d.x||1)});h+=`<div class="stats">`+Object.keys(SN).map(k=>`<span>${SN[k]}<b>+${fmt(o[k]||0)}%</b></span>`).join('')+`</div>`}

 if(sel){const it=L.find(x=>x.id===sel);if(it){const d=C.defs[it.t];const eqd=E&&E.includes(it.id);
  h+=`<div class="detail"><img src="${src(d.k)}" alt=""><div style="flex:1;min-width:0"><div class="dn"><span class="pill" style="background:${GC[it.g]}">${GR[it.g]}</span>${d.n}</div><div class="ds">${C.desc(it)}<br><b>${it.g>=8?'최고 등급이에요':'같은 등급을 하나 더 누르면 합성 → '+GR[it.g+1]}</b></div></div>${E?`<button class="btn ${eqd?'alt':''}" style="flex:0 0 auto" data-act="eq">${eqd?'해제':'장착'}</button>`:''}</div>`}}
 else h+=`<p class="sub">칸을 눌러 고르고, 같은 등급끼리 연달아 누르면 합성돼요. (${L.length}/${C.cap})</p>`;

 return h}

 const b=e.target.closest('button');if(!b)return;const C=COL[tab];
 if(b.dataset.id&&C){const id=+b.dataset.id,L=C.list(),it=L.find(x=>x.id===id);reveal=null;
  if(sel&&sel!==id){const a=L.find(x=>x.id===sel);if(a&&a.g===it.g&&it.g<8){merge(tab,a,it);ST=stats();sel=it.id;sfx('up');renderModal();return}}
  sel=sel===id?null:id;renderModal();return}
 let act=b.dataset.act;
 if(act==='eq'&&C){equip(tab,C.list().find(x=>x.id===sel));return}
 if(act==='d1')return draw(tab,1);if(act==='d10')return draw(tab,10);if(act==='free')return draw(tab,1,true);if(act==='am')return autoMerge(tab);
 if(act==='gu'){const c=guCost(S.gu);if(S.gem<c)return;S.gem-=c;S.gu++;ST=stats();guAnim=1;sfx('win');toast('구름이 Lv.'+S.gu+'!');renderModal();return}
 if(act==='closeOff'){closeModal();return}
 if(act==='rebOpen'){openModal('rebirth');return}
 if(act==='rebAllGo'){openModal('rebirth');act='rebAll'}
 if(b.dataset.skin){S.skin=+b.dataset.skin;renderModal();return}
 if(b.dataset.gskin){S.gskin=+b.dataset.gskin;guAnim=1;renderModal();return}
 if(b.dataset.gbuy){const i=+b.dataset.gbuy;if(S.gem<GSKINS[i].cost){toast('다이아가 부족해요');return}S.gem-=GSKINS[i].cost;S.gskins=S.gskins||[0];S.gskins.push(i);S.gskin=i;ST=stats();guAnim=1;sfx('win');toast(GSKINS[i].n+' 획득!');renderModal();return}
 if(b.dataset.buy){const i=+b.dataset.buy;if(S.gem<SKINS[i].cost){toast('다이아가 부족해요');return}S.gem-=SKINS[i].cost;S.skins.push(i);S.skin=i;ST=stats();happyT=1.2;sfx('win');renderModal();return}
 if(act==='reb'){if(!confirmReb){confirmReb=true;renderModal();return}doRebirth();return}
 if(b.dataset.star){starTry(+b.dataset.star);renderModal();return}
 if(b.dataset.reb)return;
 if(b.dataset.rebmax){let n=0;while(rebBuy(b.dataset.rebmax))n++;if(n){sfx('up');toast('+'+n+'레벨 강화')}renderModal();return}
 if(act==='rebAll'){let n=0;for(;;){const ks=['atk','gold','spd'].map(k=>[k,rebCost(k,S.reb[k])*(k==='spd'?1.5:1)]).sort((a,b)=>a[1]-b[1]);let ok=false;for(const [k] of ks){if(rebBuy(k)){ok=true;n++;break}}if(!ok)break}if(n){sfx('win');toast('구슬로 '+n+'레벨 강화했어요')}renderModal();return}
 if(act==='raid'){startRaid();return}
 if(b.dataset.mis){claimMission(b.dataset.mis);return}
 if(act==='snd'){S.sound=!S.sound;renderModal();return}
 if(act==='cpn'){useCoupon($('#coupon').value);return}
 if(act==='copy'){const v=$('#saveOut').value;try{navigator.clipboard.writeText(v).then(()=>toast('복사했어요'),()=>{$('#saveOut').select();toast('선택됐어요. 길게 눌러 복사하세요')})}catch(err){$('#saveOut').select()}return}
 if(act==='imp'){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#saveIn').value.trim()))));if(!o||!o.lv)throw 0;S=Object.assign(fresh(),o);ST=stats();resetWorld();save();toast('불러왔어요');closeModal()}catch(err){toast('코드가 올바르지 않아요')}return}
 if(act==='reset'){if(!confirmReset){confirmReset=true;renderModal();return}S=fresh();ST=stats();resetWorld();save();closeModal();toast('새로 시작!')}
});
const CPN={'1nnhhfs':{g:10000,re:1},'1esd6jo':{g:100000},'o6hisk':{g:1000},'gltmfo':{g:10000},'1jb8r0l':{g:3000},'1jdmf4v':{g:500},'o5ifrp':{g:5000},'yjlnmn':{g:2000},'7rgok1':{g:3000,o:100},'1cc1znz':{o:500},'3tkube':{w:[0,4]},'3hv7ts':{w:[1,4]},'19pb97s':{w:[2,4]},'6j3atj':{w:[15,5]}};
function hc(s){let h=5381;for(const c of s)h=(Math.imul(h,33)^c.codePointAt(0))>>>0;return h.toString(36)}
function useCoupon(v){const c=(v||'').replace(/\s+/g,'').toUpperCase();if(!c){toast('쿠폰 코드를 입력하세요');return}const h=hc(c);if(!(h in CPN)){toast('없는 쿠폰 코드예요');return}S.used=S.used||[];const R=CPN[h];if(!R.re){if(S.used.includes(h)){toast('이미 사용한 쿠폰이에요');return}S.used.push(h)}const msg=[];if(R.g){S.gem+=R.g;msg.push('💎 +'+R.g.toLocaleString())}if(R.o){S.orb+=R.o;msg.push('구슬 +'+R.o.toLocaleString())}if(R.w){S.guns.push({id:S.nid++,t:R.w[0],g:R.w[1]});S.dex['w'+R.w[0]]=1;msg.push(GR[R.w[1]]+' '+TOYS[R.w[0]].n)}happyT=1.4;sfx('win');ST=stats();save();toast('쿠폰 사용! '+msg.join(' · '));const i=$('#coupon');if(i)i.value='';hud()}
function rebBuy(k){const c=rebCost(k,S.reb[k]);if(S.orb<c)return false;S.orb-=c;S.reb[k]++;ST=stats();return true}
let holdT=null,holdK=null;function holdStop(){clearTimeout(holdT);holdT=null;holdK=null}
function holdStep(d){if(!holdK)return;if(rebBuy(holdK)){sfx('up');renderModal();holdT=setTimeout(()=>holdStep(Math.max(40,d*.8)),d)}else{holdStop();renderModal()}}
document.getElementById('sheetBody').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-reb]');if(!b||b.disabled)return;e.preventDefault();holdK=b.dataset.reb;if(rebBuy(holdK)){sfx('up');renderModal();holdT=setTimeout(()=>holdStep(160),380)}else holdStop()});
['pointerup','pointercancel','blur'].forEach(ev=>window.addEventListener(ev,holdStop));

function rebGain(){const s=S.maxS;if(s<15)return 0;return Math.floor(Math.pow(s-12,1.9)*(1+S.rebCount*.15))}
let lastReb=0;function doRebirth(){const g=rebGain();if(g<=0)return;best();S.gps=0;S.rebTarget=S.bestS;lastReb=g;S.orb+=g;S.rebCount++;S.gold=0;S.W=1;S.sub=1;S.maxS=0;S.farm=false;S.lv={atk:0,spd:0,gold:0};ST=stats();resetWorld();save();openModal('rebDone');happyT=1.5;sfx('win')}
function resetWorld(){foes=[];buls=[];boss=null;raid=null;mode='walk';walkT=1;hudStage()}

/* ---------- missions ---------- */
function missions(){const M=S.mis,st=S.st;const T=k=>M[k]||0;
 return[
 {k:'kills',n:'적 처치',ic:'e_squirrel',goal:100*Math.pow(2,T('kills')),cur:st.kills,r:20+10*T('kills')},
 {k:'stage',n:'스테이지 도달',ic:'i_trophy',goal:(T('stage')+1)*10,cur:S.maxS,r:30+10*T('stage'),lbl:v=>(Math.floor(v/5)+1)+'-'+(v%5+1)},
 {k:'draws',n:'삑삑이 뽑기',ic:'w_peach',goal:5*Math.pow(2,T('draws')),cur:st.draws,r:40+10*T('draws')},
 {k:'merges',n:'합성하기',ic:'i_chest',goal:5*Math.pow(2,T('merges')),cur:st.merges,r:30+10*T('merges')},
 {k:'ups',n:'강화하기',ic:'i_atk',goal:30*Math.pow(2,T('ups')),cur:st.ups,r:20+10*T('ups')}]}
function claimMission(k){const m=missions().find(x=>x.k===k);if(!m||m.cur<m.goal)return;S.gem+=m.r;S.mis[k]=(S.mis[k]||0)+1;sfx('win');toast('💎 +'+m.r);renderModal()}

/* ---------- daily / offline ---------- */
function daily(){const d=new Date().toISOString().slice(0,10);if(S.day!==d){const first=!S.day;S.day=d;S.raidTries=3;if(!first){S.gem+=100;toast('출석 보상 💎 +100')}}}
let offFrom='',offTo='';
function offline(){const dt=Math.min(8*3600,(now()-(S.last||now()))/1e3);if(dt<=60)return;
 ST=stats();let budget=dt,gold=0,st=sIdx();const s0=st;
 let dps=0;S.gunEq.forEach((id,i)=>{const g=S.guns.find(x=>x.id===id);if(g)dps+=toyDps(g,i)});
 const B=best();if(!S.farm&&dps>0){while(st<B){const W=Math.floor(st/5)+1,sub=st%5+1,boss=sub===5;
   const n=boss?1:12+Math.min(18,Math.floor(W*1.5));const hp=eHP(st)*(boss?34:n);const tk=hp/dps;
   if(tk>(boss?20:35))break;const tt=tk+(boss?2:1.5);if(budget<tt)break;budget-=tt;
   const sg=eGold(st)*ST.gold*(boss?12:n);gold+=sg;S.gold+=sg;if(boss)S.gem+=5+W*2;st++;
   if(S.auto){autoBuy();ST=stats();dps=0;S.gunEq.forEach((id,i)=>{const g=S.guns.find(x=>x.id===id);if(g)dps+=toyDps(g,i)})}}
  if(st>s0){S.W=Math.floor(st/5)+1;S.sub=st%5+1;S.maxS=Math.max(S.maxS,st)}}
 const sNow=sIdx(),nNow=12+Math.min(18,Math.floor(S.W*1.5));const rate=eGold(sNow)*ST.gold*nNow/Math.max(8,Math.min(35,eHP(sNow)*nNow/Math.max(dps,1e-9)+1.5));const lg=Math.min(S.gps||rate,rate)*budget*.6;gold+=lg;offGold=gold;S.gold+=lg;
 offFrom=st>s0?(Math.floor(s0/5)+1)+'-'+(s0%5+1):'';offTo=st>s0?S.W+'-'+S.sub:'';
 if(gold>0||offTo){resetWorld();openModal('offline')}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{offline();daily();S.last=now();checkUpdate()}});

/* ---------- loop ---------- */
let lt=performance.now(),hudT=0,saveT=0;
function loop(n){const dt=Math.min(.05,(n-lt)/1e3);lt=n;
 if(!document.hidden){const fast=boost();update(dt);if(fast)update(dt);render();hudT+=dt;saveT+=dt;if(hudT>.2){hudT=0;if(!buffOn()&&S.buffEnd&&ST.dmg){}autoBuy();ST=stats();hud();if(tab&&COL[tab]&&COL[tab].free&&!sel)updFree()}if(saveT>10){saveT=0;save()}}
 requestAnimationFrame(loop)}
function best(){S.bestS=Math.max(S.bestS||0,S.maxS||0,S.rebTarget||0,((S.mis&&S.mis.stage)||0)*10);return S.bestS}
function boost(){return sIdx()<best()&&mode!=='raid'&&!S.farm}
function updFree(){const b=document.querySelector('[data-act="free"]');if(!b)return;const C=COL[tab];const fl=timeLeft(C.free,C.cd);b.disabled=!!fl;b.textContent=fl?'무료 '+fl:'무료 뽑기'}
function checkUpdate(){if(!/github\.io$/.test(location.hostname))return;try{fetch(location.pathname+'?vc='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(tx=>{const m=tx.match(/const VER='([^']+)'/);if(m&&m[1]!==VER&&!document.getElementById('updBar')){const d=document.createElement('button');d.id='updBar';d.textContent='새 버전이 나왔어요 · 눌러서 업데이트';d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);z-index:50;background:#d4f03c;color:#2f3a07;border:3px solid #0f1628;border-radius:999px;padding:8px 16px;font-family:Jua,sans-serif;font-size:15px;box-shadow:0 3px 0 #0f1628';d.onclick=()=>{save();location.replace(location.pathname+'?v='+encodeURIComponent(m[1]))};document.body.appendChild(d)}}).catch(()=>{})}catch(e){}}
function start(){checkUpdate();setInterval(checkUpdate,5*60e3);resize();ST=stats();offline();daily();S.last=now();hudStage();hud();if(S.st.kills===0)toast('요요 출동! 복숭아·메론·참외 삑삑이 장착 완료');requestAnimationFrame(loop)}
window.__yoyo={grade:()=>({PET_A,TV,SKINS,GSKINS,GM}),spend:()=>{for(const kind of ['guns','pets']){const C=COL[kind];while(S.gem>=C.cost*9&&C.list().length<=C.cap-10){draw(kind,10)}while(S.gem>=C.cost&&C.list().length<C.cap)draw(kind,1);autoMerge(kind);const L=C.list().slice().sort((a,b)=>kind==='guns'?toyDps(b)-toyDps(a):b.g-a.g);const E=C.eq();for(let i=0;i<3;i++)E[i]=L[i]?L[i].id:0}for(let k=0;k<200;k++){const st=SL();const i=[0,1,2].reduce((a,b)=>st[b]<st[a]?b:a);if(st[i]>=STAR_MAX||S.gem<STAR_COST[st[i]])break;starTry(i)}tab=null;$('#modal').hidden=true;ST=stats();return S.guns.map(g=>GR[g.g]).join('')+' ⭐'+SL().join('/')},rebirth:()=>{doRebirth();const rc=rebCost;for(let i=0;i<999;i++){const ks=['atk','gold','spd'].map(k=>[k,rc(k,S.reb[k])]).sort((a,b)=>a[1]-b[1]);if(S.orb<ks[0][1])break;S.orb-=ks[0][1];S.reb[ks[0][0]]++}ST=stats();return S.reb},tick:(sec)=>{for(let i=0;i<sec*20;i++){update(.05);if(i%4===0){autoBuy();ST=stats()}}},get S(){return S},stats:()=>ST,set:o=>{Object.assign(S,o);ST=stats();hudStage()},bark};
if(hot&&hot.ready)hot.ready(start);else start();
})();
